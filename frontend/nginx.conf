server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Hashed build assets (Vite's default output naming) can be cached
    # forever; index.html itself must always be revalidated so a deploy is
    # picked up on next load instead of being served from a stale cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxied to the backend over Liara's private network (both apps share
    # the `graduation-net` network — the backend has no public domain of its
    # own). Docker's embedded DNS (127.0.0.11) re-resolves "graduation-backend"
    # per request via $backend_upstream instead of once at nginx startup,
    # since the backend's internal IP can change on every redeploy.
    resolver 127.0.0.11 valid=30s;
    location /api/ {
        set $backend_upstream graduation-backend;
        # $request_uri (the untouched original path+query) is required here:
        # once the proxy_pass target's host is a variable, nginx stops doing
        # its usual "replace the location-matched prefix" rewrite and would
        # otherwise always proxy to the bare "/api/" path.
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host graduation-backend;
        # Liara's own edge already terminates TLS and sets this header on
        # the request nginx receives; pass it through rather than hardcoding
        # a scheme, since nginx's own $scheme here is always plain http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # The real public host the browser used, separate from the Host
        # header above — DRF pagination uses this to build correct
        # next/previous links (see config/pagination.py) instead of leaking
        # the internal "graduation-backend" hostname.
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
